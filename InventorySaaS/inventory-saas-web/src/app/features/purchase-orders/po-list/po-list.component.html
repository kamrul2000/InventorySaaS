<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Purchase Orders</h1>
      <p class="page-subtitle">Track and manage supplier purchase orders</p>
    </div>
    <button class="btn-primary" (click)="create()">
      <mat-icon>add</mat-icon> Create PO
    </button>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label class="filter-label">Status</label>
      <mat-select appSearchableSelect class="form-select app-select" [(ngModel)]="statusFilter" (ngModelChange)="loadOrders()" panelClass="app-select-panel">
        <mat-option value="">All Statuses</mat-option>
        <mat-option value="Draft">Draft</mat-option>
        <mat-option value="Submitted">Submitted</mat-option>
        <mat-option value="Approved">Approved</mat-option>
        <mat-option value="Received">Received</mat-option>
        <mat-option value="Cancelled">Cancelled</mat-option>
      </mat-select>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="orders"
    [totalCount]="totalCount"
    [pageSize]="pageSize"
    [loading]="loading"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearch($event)"
    (rowAction)="onRowAction($event)">
  </app-data-table>
</div>
