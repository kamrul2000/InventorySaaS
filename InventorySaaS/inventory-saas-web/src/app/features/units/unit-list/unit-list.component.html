<div class="page">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Units of Measure</h1>
      <p class="page-subtitle">Manage the units your products are counted in</p>
    </div>
    <button class="btn-primary" routerLink="/units/new">
      <mat-icon>add</mat-icon>
      Add Unit
    </button>
  </div>

  <!-- Data Table -->
  <app-data-table
    [columns]="columns"
    [data]="units"
    [totalCount]="totalCount"
    [pageSize]="pageSize"
    [loading]="loading"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearch($event)"
    (rowAction)="onRowAction($event)"
  >
  </app-data-table>
</div>
