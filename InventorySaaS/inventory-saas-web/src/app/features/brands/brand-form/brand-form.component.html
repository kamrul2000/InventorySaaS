<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEditMode ? 'Edit Brand' : 'New Brand' }}</h2>
    <button class="dialog-close" (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body">
    <form [formGroup]="form">
      <div class="form-group">
        <label class="form-label">Brand Name</label>
        <input class="form-input" formControlName="name" placeholder="Enter brand name">
        @if (form.get('name')?.hasError('required') && form.get('name')?.touched) {
          <span class="form-error">Name is required</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input form-textarea" formControlName="description" rows="3" placeholder="Enter description"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Logo URL</label>
        <input class="form-input" formControlName="logoUrl" placeholder="https://example.com/logo.png">
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="isActive">
          <span>Active</span>
        </label>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button class="btn-secondary" (click)="dialogRef.close()">Cancel</button>
    <button class="btn-primary" (click)="save()" [disabled]="form.invalid || saving">
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
  </div>
</div>
